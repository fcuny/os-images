[Distribution]
Distribution=fedora
Release=45

[Output]
Format=disk
ImageId=demo
ImageVersion=1
Output=%i_%v
OutputDirectory=mkosi.output
SplitArtifacts=uki,partitions
ManifestFormat=json

[Build]
ToolsTree=yes

[Content]
Bootable=yes
UnifiedKernelImageFormat=%i_%v
# Find /usr and / by partition type, and only accept a verity-protected /usr.
# mkosi adds usrhash= by itself, which ties this UKI to one /usr slot.
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        panic=10
        systemd.firstboot=off
        systemd.image_policy=esp=unprotected:usr=verity:root=unprotected+absent:=ignore
        systemd.image_filter=usr=demo_*:usr-verity=demo_*:root=demo-root
InitrdPackages=libfdisk
Packages=
        kernel-core
        systemd
        dbus-broker         # D-Bus: updatectl, hostnamectl and friends need it, and nothing pulls it in
        systemd-boot-unsigned
        systemd-udev
        systemd-container   # systemd-pull, which sysupdate uses for HTTP sources
        libcurl             # systemd-pull loads it with dlopen(), so no package pulls it in
        systemd-networkd
        systemd-resolved
        openssh-server
        iproute
        procps-ng
        less
        pciutils
        btrfs-progs
        util-linux

[Runtime]
RAM=2G
RuntimeSize=8G
Credentials=
        tty.serial.hvc0.agetty.autologin=root
        tty.serial.hvc0.login.noauth=yes
        tty.console.agetty.autologin=root
        tty.console.login.noauth=yes
