# The same image on Debian testing, for the GCE example: mkosi --profile=debian.
[Distribution]
Distribution=debian
Release=forky
# Every package comes from this snapshot of the Debian archive
# (snapshot.debian.org), so building twice installs the same packages.
# `mkosi --profile=debian latest-snapshot` prints the newest one.
Snapshot=20261122T143046Z

[Config]
# Debian ships every kernel module in the kernel package: no extra-modules.
Dependencies=
Dependencies=base,debug,demo-config

[Content]
InitrdPackages=
InitrdPackages=libfdisk1
# GCE's Arm machines print the serial console on ttyAMA0, as qemu's virt does.
KernelCommandLine=console=ttyAMA0
# openssh-server makes host keys when it's installed. Shipped, every machine
# would share them, and the private keys would sit in the factory /etc in /usr.
RemoveFiles=/etc/ssh/ssh_host_*
