# The operating system, as a plain directory. It keeps the package database,
# so the extensions in mkosi.images/ only add what their packages bring. The
# main image (mkosi.conf) is built from this tree and drops the database.
[Output]
Format=directory
ImageId=base
Output=base
ManifestFormat=json   # the package list for each build: the main image installs nothing itself

[Build]
# With Bootable=no, mkosi lets the kernel package run kernel-install, which
# builds a dracut initrd and a boot entry that the main image would copy into
# its ESP. The main image makes its own UKI, so skip that here.
Environment=KERNEL_INSTALL_BYPASS=1

[Content]
Bootable=no
CleanPackageMetadata=no
Packages=
        kernel-core
        systemd
        dbus-broker         # D-Bus: updatectl, hostnamectl and friends need it, and nothing pulls it in
        systemd-boot-unsigned
        systemd-udev
        systemd-container   # systemd-pull, which sysupdate uses for HTTP sources
        libcurl             # systemd-pull loads it with dlopen(), so no package pulls it in
        systemd-networkd
        systemd-resolved
        openssh-server
        iproute
        procps-ng
        less
        pciutils
        btrfs-progs
        util-linux
