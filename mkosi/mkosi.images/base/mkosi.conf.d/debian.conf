[Match]
Profiles=debian

[Content]
Packages=
Packages=
        linux-image-cloud-arm64
        systemd
        systemd-sysv        # /sbin/init
        udev
        dbus-broker
        systemd-boot
        systemd-boot-efi
        systemd-repart
        systemd-cryptsetup  # systemd-veritysetup, to open /usr
        systemd-container   # systemd-pull, which sysupdate uses for HTTP sources
        systemd-resolved
        systemd-imds        # instance metadata, on GCE
        libcurl4t64         # systemd-pull loads it with dlopen()
        ca-certificates     # HTTPS update sources: without it, systemd-pull can't verify the server
        libfdisk1
        openssh-server
        iproute2
        procps
        less
        pciutils
        btrfs-progs
        util-linux
        login
        passwd
        libpam-systemd
