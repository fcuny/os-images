# A system extension with debugging tools, signed with mkosi.key. It holds
# only the files strace and tcpdump add on top of the base image.
[Config]
Dependencies=base

[Output]
Format=sysext
ImageId=debug
Output=debug
Overlay=yes

[Content]
BaseTrees=%O/base
Packages=
        strace
        tcpdump

[Validation]
Verity=signed
