# Kernel modules in a system extension: Fedora's kernel-modules-extra, built
# for the same kernel as the base image.
[Config]
Dependencies=base

[Output]
Format=sysext
ImageId=extra-modules
Output=extra-modules
Overlay=yes

[Content]
BaseTrees=%O/base
Packages=kernel-modules-extra

[Validation]
Verity=hash
